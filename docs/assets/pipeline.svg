<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 436" role="img" aria-label="How a payment is decided: feature store, additive model, guardrail rules, cost policy, then approve, step-up or decline, and what was learned flows back">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d172d"/><stop offset="1" stop-color="#13224a"/></linearGradient>
    <linearGradient id="ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7f93ff"/><stop offset="1" stop-color="#3fd6a6"/></linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8ea0ff"/></marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000" flood-opacity=".35"/></filter>
    <style>
      .f{font-family:Inter,'Segoe UI',Arial,sans-serif}
      @keyframes flow{to{stroke-dashoffset:-28}}
      .flow{stroke-dasharray:8 6;animation:flow 1.2s linear infinite}
    </style>
  </defs>
  <rect width="1200" height="436" rx="20" fill="url(#bg)"/>
  <text x="600" y="40" text-anchor="middle" class="f" font-size="20" font-weight="800" fill="#fff">One payment, five steps, about a millisecond</text>

  <!-- arrival -->
  <g class="f" filter="url(#sh)">
    <rect x="36" y="92" width="130" height="150" rx="14" fill="#1d2d5a" stroke="#8ea0ff" stroke-opacity=".5"/>
    <text x="101" y="124" text-anchor="middle" font-size="26" fill="#fff" font-weight="800">₹18,500</text>
    <text x="101" y="150" text-anchor="middle" font-size="13" fill="#b9c6e8">UPI · p2p</text>
    <text x="101" y="172" text-anchor="middle" font-size="13" fill="#b9c6e8">new payee</text>
    <text x="101" y="194" text-anchor="middle" font-size="13" fill="#b9c6e8">screen-share on</text>
    <text x="101" y="226" text-anchor="middle" font-size="12" fill="#7f93ff" font-weight="800">A PAYMENT ARRIVES</text>
  </g>

  <g stroke="#8ea0ff" stroke-width="2.2" fill="none" marker-end="url(#ar)" class="flow">
    <path d="M168 167H204"/><path d="M356 167H392"/><path d="M544 167H580"/><path d="M732 167H768"/><path d="M920 167H956"/>
  </g>

  <!-- stage boxes -->
  <g class="f" filter="url(#sh)">
    <g transform="translate(206 92)"><rect width="148" height="150" rx="14" fill="#f4f7ff"/>
      <circle cx="74" cy="34" r="17" fill="#e1e7ff"/><path d="M64 34h20M74 24v20" stroke="#3b57e0" stroke-width="3" stroke-linecap="round"/>
      <text x="74" y="76" text-anchor="middle" font-size="15" font-weight="800" fill="#1b2638">1 Memory</text>
      <text x="74" y="97" text-anchor="middle" font-size="12.5" fill="#4a5a76">44 streaming features</text>
      <text x="74" y="115" text-anchor="middle" font-size="12.5" fill="#4a5a76">read before the</text><text x="74" y="132" text-anchor="middle" font-size="12.5" fill="#4a5a76">payment is stored</text></g>
    <g transform="translate(394 92)"><rect width="148" height="150" rx="14" fill="#f4f7ff"/>
      <circle cx="74" cy="34" r="17" fill="#e1e7ff"/><path d="M60 42l8-10 6 6 10-14" fill="none" stroke="#3b57e0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="74" y="76" text-anchor="middle" font-size="15" font-weight="800" fill="#1b2638">2 Model</text>
      <text x="74" y="97" text-anchor="middle" font-size="12.5" fill="#4a5a76">additive: a sum of</text>
      <text x="74" y="115" text-anchor="middle" font-size="12.5" fill="#4a5a76">visible contributions,</text><text x="74" y="132" text-anchor="middle" font-size="12.5" fill="#4a5a76">so reasons are exact</text></g>
    <g transform="translate(582 92)"><rect width="148" height="150" rx="14" fill="#f4f7ff"/>
      <circle cx="74" cy="34" r="17" fill="#fde4e8"/><path d="M74 24l9 4v8c0 6-4 10-9 12-5-2-9-6-9-12v-8z" fill="none" stroke="#cc2f46" stroke-width="2.6" stroke-linejoin="round"/>
      <text x="74" y="76" text-anchor="middle" font-size="15" font-weight="800" fill="#1b2638">3 Guardrails</text>
      <text x="74" y="97" text-anchor="middle" font-size="12.5" fill="#4a5a76">rules that can only</text>
      <text x="74" y="115" text-anchor="middle" font-size="12.5" fill="#4a5a76">make the answer</text><text x="74" y="132" text-anchor="middle" font-size="12.5" fill="#4a5a76">stricter, never looser</text></g>
    <g transform="translate(770 92)"><rect width="148" height="150" rx="14" fill="#f4f7ff"/>
      <circle cx="74" cy="34" r="17" fill="#fff0cf"/><text x="74" y="43" text-anchor="middle" font-size="22" font-weight="800" fill="#b97d00">₹</text>
      <text x="74" y="76" text-anchor="middle" font-size="15" font-weight="800" fill="#1b2638">4 Cost policy</text>
      <text x="74" y="97" text-anchor="middle" font-size="12.5" fill="#4a5a76">pick the action with</text>
      <text x="74" y="115" text-anchor="middle" font-size="12.5" fill="#4a5a76">the lowest expected</text><text x="74" y="132" text-anchor="middle" font-size="12.5" fill="#4a5a76">cost, in rupees</text></g>
    <g transform="translate(958 92)"><rect width="148" height="150" rx="14" fill="#f4f7ff"/>
      <circle cx="74" cy="34" r="17" fill="#d8f3ea"/><path d="M64 34l7 7 13-14" fill="none" stroke="#0f8a66" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="74" y="76" text-anchor="middle" font-size="15" font-weight="800" fill="#1b2638">5 Answer</text>
      <text x="74" y="97" text-anchor="middle" font-size="12.5" fill="#4a5a76">one of three, plus</text>
      <text x="74" y="115" text-anchor="middle" font-size="12.5" fill="#4a5a76">reasons and a message</text><text x="74" y="132" text-anchor="middle" font-size="12.5" fill="#4a5a76">in Hindi or English</text></g>
  </g>

  <!-- outcomes -->
  <g class="f" font-weight="800" font-size="14">
    <rect x="958" y="262" width="148" height="30" rx="15" fill="#0f8a66"/><text x="1032" y="282" text-anchor="middle" fill="#fff">APPROVE</text>
    <rect x="958" y="298" width="148" height="30" rx="15" fill="#e0a21a"/><text x="1032" y="318" text-anchor="middle" fill="#2a1d00">STEP-UP</text>
    <rect x="958" y="334" width="148" height="30" rx="15" fill="#cc2f46"/><text x="1032" y="354" text-anchor="middle" fill="#fff">DECLINE</text>
  </g>

  <!-- feedback loop -->
  <path d="M1032 242V256" stroke="#8ea0ff" stroke-width="2.2"/>
  <path d="M1032 366V414H280V252" fill="none" stroke="url(#ln)" stroke-width="2.4" stroke-dasharray="8 6" class="flow" marker-end="url(#ar)"/>
  <g class="f" font-size="13" fill="#b9c6e8">
    <text x="300" y="376">After the decision, the payment is added to memory. Later complaints and analyst verdicts</text>
    <text x="300" y="396">teach it which payees, devices and networks to distrust. Nothing ever peeks ahead.</text>
  </g>
  <g class="f" font-size="13" fill="#7f93ff" font-weight="800"><text x="36" y="300">NEVER PEEKS AHEAD</text></g>
  <g class="f" font-size="13" fill="#b9c6e8"><text x="36" y="322">Every feature is built from</text><text x="36" y="340">what was known before.</text></g>
</svg>
