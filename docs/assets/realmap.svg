<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-label="What is real and what is simulated: each console tab is labelled simulated, real public data, real Razorpay test mode or your input">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d172d"/><stop offset="1" stop-color="#14224a"/></linearGradient>
    <style>.f{font-family:Inter,'Segoe UI',Arial,sans-serif}</style>
  </defs>
  <rect width="1200" height="470" rx="20" fill="url(#bg)"/>
  <text x="40" y="44" class="f" font-size="20" font-weight="800" fill="#fff">What is real, and what is not</text>
  <text x="40" y="68" class="f" font-size="14" fill="#9fb0cf">Every console tab wears one of these labels, so nobody has to guess.</text>

  <g class="f">
    <g transform="translate(40 92)"><rect width="268" height="260" rx="16" fill="#3a2d0f" stroke="#e0a21a"/><rect x="16" y="16" width="112" height="26" rx="13" fill="#e0a21a"/><text x="72" y="34" text-anchor="middle" font-size="12.5" font-weight="800" fill="#2a1d00">SIMULATED</text>
      <text x="16" y="72" font-size="13" fill="#f3dfae">Generated by the simulator:</text>
      <g font-size="14.5" fill="#fff" font-weight="700"><text x="16" y="102">Live ops (default)</text><text x="16" y="128">Review queue</text><text x="16" y="154">Red team</text><text x="16" y="180">Mule graph</text><text x="16" y="206">Policy lab</text><text x="16" y="232">Model card</text></g></g>
    <g transform="translate(330 92)"><rect width="268" height="260" rx="16" fill="#0f3a2e" stroke="#3fd6a6"/><rect x="16" y="16" width="148" height="26" rx="13" fill="#3fd6a6"/><text x="90" y="34" text-anchor="middle" font-size="12.5" font-weight="800" fill="#06281f">REAL PUBLIC DATA</text>
      <text x="16" y="72" font-size="13" fill="#bdeedd">Public research datasets:</text>
      <g font-size="14.5" fill="#fff" font-weight="700"><text x="16" y="102">Real data tab</text><text x="16" y="128">Live ops, with the</text><text x="16" y="146">"Real card data" switch</text><text x="16" y="178">Real messages inside</text><text x="16" y="196">Scam Shield</text></g>
      <g font-size="12.5" fill="#a9d9cb"><text x="16" y="226">284,807 real card payments</text><text x="16" y="244">about 57,000 real SMS</text></g></g>
    <g transform="translate(620 92)"><rect width="268" height="260" rx="16" fill="#12284f" stroke="#7f93ff"/><rect x="16" y="16" width="236" height="26" rx="13" fill="#7f93ff"/><text x="134" y="34" text-anchor="middle" font-size="12.5" font-weight="800" fill="#0b1a45">REAL (RAZORPAY TEST MODE)</text>
      <text x="16" y="72" font-size="13" fill="#c5cffb">Signed webhook events:</text>
      <g font-size="14.5" fill="#fff" font-weight="700"><text x="16" y="102">Live wire</text></g>
      <g font-size="12.5" fill="#b9c6e8"><text x="16" y="132">Real events from Razorpay's test</text><text x="16" y="150">mode, signature-checked, paise</text><text x="16" y="168">converted to rupees, then</text><text x="16" y="186">decided by the same engine.</text><text x="16" y="222">No real money has ever moved.</text></g></g>
    <g transform="translate(910 92)"><rect width="250" height="260" rx="16" fill="#2b1f4f" stroke="#b48cf2"/><rect x="16" y="16" width="112" height="26" rx="13" fill="#b48cf2"/><text x="72" y="34" text-anchor="middle" font-size="12.5" font-weight="800" fill="#241046">YOUR INPUT</text>
      <text x="16" y="72" font-size="13" fill="#dccffa">Whatever you give it:</text>
      <g font-size="14.5" fill="#fff" font-weight="700"><text x="16" y="102">Scam Shield</text><text x="16" y="128">Backtest (your CSV)</text><text x="16" y="154">Playground</text></g>
      <g font-size="12.5" fill="#cbbcf0"><text x="16" y="190">Your text is checked, your CSV</text><text x="16" y="208">is replayed as-is. The bundled</text><text x="16" y="226">sample is simulated.</text></g></g>
  </g>
  <g class="f" transform="translate(40 374)">
    <rect width="1120" height="76" rx="14" fill="#ffffff" fill-opacity=".06" stroke="#ff6b82" stroke-opacity=".5"/>
    <text x="20" y="28" font-size="14" font-weight="800" fill="#ff9aab">NEVER REAL, AND SAID PLAINLY</text>
    <text x="20" y="50" font-size="14" fill="#e3e9fb">Real money. A real bank's customers. Real Indian payment fraud. No public source has them, so the behavioural engine is proven on a simulator,</text>
    <text x="20" y="68" font-size="14" fill="#e3e9fb">and ready to be fitted to a bank's own history, first in shadow mode.</text>
  </g>
</svg>
