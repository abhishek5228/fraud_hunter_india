<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-label="The Fraud Hunter stack drawn as five 3D slabs: data, engine, Scam Shield and mule graph, API, console. Two cloud cubes show it runs on Render and on AWS.">
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d172d"/><stop offset="1" stop-color="#14224a"/></linearGradient><radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#7f93ff" stop-opacity=".35"/><stop offset="1" stop-color="#7f93ff" stop-opacity="0"/></radialGradient><style>.f{font-family:Inter,"Segoe UI",Arial,sans-serif}.bob{animation:bob 5s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}.dash{stroke-dasharray:5 5;animation:dm 3s linear infinite}@keyframes dm{to{stroke-dashoffset:-20}}</style></defs>
<rect width="1200" height="650" rx="20" fill="url(#bg)"/>
<ellipse cx="330" cy="520" rx="280" ry="70" fill="url(#glow)"/>
<text x="40" y="46" class="f" font-size="22" font-weight="800" fill="#fff">The stack, in 3D</text>
<text x="40" y="68" class="f" font-size="13" fill="#8fa0ba">One payment goes in at the top and comes back as approve, step-up or decline, with reasons.</text>
<g class="bob" style="animation-delay:0.0s"><polygon points="156.8,472.0 330.0,572.0 330.0,538.0 156.8,438.0" fill="#ae7e14"/><polygon points="330.0,572.0 503.2,472.0 503.2,438.0 330.0,538.0" fill="#7b590e"/><polygon points="330.0,338.0 503.2,438.0 330.0,538.0 156.8,438.0" fill="#e5b243" stroke="#efd08c" stroke-opacity=".9"/><line x1="373.3" y1="363.0" x2="200.1" y2="463.0" stroke="#fff" stroke-opacity=".12"/><line x1="286.7" y1="363.0" x2="459.9" y2="463.0" stroke="#fff" stroke-opacity=".12"/><line x1="416.6" y1="388.0" x2="243.4" y2="488.0" stroke="#fff" stroke-opacity=".12"/><line x1="243.4" y1="388.0" x2="416.6" y2="488.0" stroke="#fff" stroke-opacity=".12"/><line x1="459.9" y1="413.0" x2="286.7" y2="513.0" stroke="#fff" stroke-opacity=".12"/><line x1="200.1" y1="413.0" x2="373.3" y2="513.0" stroke="#fff" stroke-opacity=".12"/></g>
<g class="bob" style="animation-delay:0.5s"><polygon points="156.8,416.0 330.0,516.0 330.0,482.0 156.8,382.0" fill="#31a681"/><polygon points="330.0,516.0 503.2,416.0 503.2,382.0 330.0,482.0" fill="#22755b"/><polygon points="330.0,282.0 503.2,382.0 330.0,482.0 156.8,382.0" fill="#61ddb6" stroke="#9fead2" stroke-opacity=".9"/><line x1="373.3" y1="307.0" x2="200.1" y2="407.0" stroke="#fff" stroke-opacity=".12"/><line x1="286.7" y1="307.0" x2="459.9" y2="407.0" stroke="#fff" stroke-opacity=".12"/><line x1="416.6" y1="332.0" x2="243.4" y2="432.0" stroke="#fff" stroke-opacity=".12"/><line x1="243.4" y1="332.0" x2="416.6" y2="432.0" stroke="#fff" stroke-opacity=".12"/><line x1="459.9" y1="357.0" x2="286.7" y2="457.0" stroke="#fff" stroke-opacity=".12"/><line x1="200.1" y1="357.0" x2="373.3" y2="457.0" stroke="#fff" stroke-opacity=".12"/></g>
<g class="bob" style="animation-delay:1.0s"><polygon points="156.8,360.0 330.0,460.0 330.0,426.0 156.8,326.0" fill="#ae4e5f"/><polygon points="330.0,460.0 503.2,360.0 503.2,326.0 330.0,426.0" fill="#7b3743"/><polygon points="330.0,226.0 503.2,326.0 330.0,426.0 156.8,326.0" fill="#e58091" stroke="#efb2bc" stroke-opacity=".9"/><line x1="373.3" y1="251.0" x2="200.1" y2="351.0" stroke="#fff" stroke-opacity=".12"/><line x1="286.7" y1="251.0" x2="459.9" y2="351.0" stroke="#fff" stroke-opacity=".12"/><line x1="416.6" y1="276.0" x2="243.4" y2="376.0" stroke="#fff" stroke-opacity=".12"/><line x1="243.4" y1="276.0" x2="416.6" y2="376.0" stroke="#fff" stroke-opacity=".12"/><line x1="459.9" y1="301.0" x2="286.7" y2="401.0" stroke="#fff" stroke-opacity=".12"/><line x1="200.1" y1="301.0" x2="373.3" y2="401.0" stroke="#fff" stroke-opacity=".12"/></g>
<g class="bob" style="animation-delay:1.5s"><polygon points="156.8,304.0 330.0,404.0 330.0,370.0 156.8,270.0" fill="#6372c6"/><polygon points="330.0,404.0 503.2,304.0 503.2,270.0 330.0,370.0" fill="#45508c"/><polygon points="330.0,170.0 503.2,270.0 330.0,370.0 156.8,270.0" fill="#96a6ff" stroke="#bfc9ff" stroke-opacity=".9"/><line x1="373.3" y1="195.0" x2="200.1" y2="295.0" stroke="#fff" stroke-opacity=".12"/><line x1="286.7" y1="195.0" x2="459.9" y2="295.0" stroke="#fff" stroke-opacity=".12"/><line x1="416.6" y1="220.0" x2="243.4" y2="320.0" stroke="#fff" stroke-opacity=".12"/><line x1="243.4" y1="220.0" x2="416.6" y2="320.0" stroke="#fff" stroke-opacity=".12"/><line x1="459.9" y1="245.0" x2="286.7" y2="345.0" stroke="#fff" stroke-opacity=".12"/><line x1="200.1" y1="245.0" x2="373.3" y2="345.0" stroke="#fff" stroke-opacity=".12"/></g>
<g class="bob" style="animation-delay:2.0s"><polygon points="156.8,248.0 330.0,348.0 330.0,314.0 156.8,214.0" fill="#8c6dbc"/><polygon points="330.0,348.0 503.2,248.0 503.2,214.0 330.0,314.0" fill="#634d85"/><polygon points="330.0,114.0 503.2,214.0 330.0,314.0 156.8,214.0" fill="#c1a0f4" stroke="#d9c5f8" stroke-opacity=".9"/><line x1="373.3" y1="139.0" x2="200.1" y2="239.0" stroke="#fff" stroke-opacity=".12"/><line x1="286.7" y1="139.0" x2="459.9" y2="239.0" stroke="#fff" stroke-opacity=".12"/><line x1="416.6" y1="164.0" x2="243.4" y2="264.0" stroke="#fff" stroke-opacity=".12"/><line x1="243.4" y1="164.0" x2="416.6" y2="264.0" stroke="#fff" stroke-opacity=".12"/><line x1="459.9" y1="189.0" x2="286.7" y2="289.0" stroke="#fff" stroke-opacity=".12"/><line x1="200.1" y1="189.0" x2="373.3" y2="289.0" stroke="#fff" stroke-opacity=".12"/></g>
<line class="dash" x1="420.6" y1="281.0" x2="560" y2="281.0" stroke="#b48cf2" stroke-opacity=".8"/>
<circle cx="416.6" cy="281.0" r="3.5" fill="#b48cf2"/>
<text x="572" y="279.0" class="f" font-size="15" font-weight="800" fill="#b48cf2">CONSOLE</text>
<text x="572" y="295.0" class="f" font-size="12.5" fill="#cfd8f3">11 tabs: Live ops, Review, Backtest, Red team,</text>
<text x="572" y="310.0" class="f" font-size="12.5" fill="#cfd8f3">Scam Shield, Mule graph, Live wire, Real data</text>
<line class="dash" x1="420.6" y1="337.0" x2="560" y2="337.0" stroke="#7f93ff" stroke-opacity=".8"/>
<circle cx="416.6" cy="337.0" r="3.5" fill="#7f93ff"/>
<text x="572" y="335.0" class="f" font-size="15" font-weight="800" fill="#7f93ff">API</text>
<text x="572" y="351.0" class="f" font-size="12.5" fill="#cfd8f3">FastAPI, live stream, per-IP rate limits,</text>
<text x="572" y="366.0" class="f" font-size="12.5" fill="#cfd8f3">shadow mode, signed webhooks</text>
<line class="dash" x1="420.6" y1="393.0" x2="560" y2="393.0" stroke="#e0657a" stroke-opacity=".8"/>
<circle cx="416.6" cy="393.0" r="3.5" fill="#e0657a"/>
<text x="572" y="391.0" class="f" font-size="15" font-weight="800" fill="#e0657a">SCAM SHIELD + MULE GRAPH</text>
<text x="572" y="407.0" class="f" font-size="12.5" fill="#cfd8f3">26 rules plus a learned word model,</text>
<text x="572" y="422.0" class="f" font-size="12.5" fill="#cfd8f3">a linked-account graph that finds mules</text>
<line class="dash" x1="420.6" y1="449.0" x2="560" y2="449.0" stroke="#3fd6a6" stroke-opacity=".8"/>
<circle cx="416.6" cy="449.0" r="3.5" fill="#3fd6a6"/>
<text x="572" y="447.0" class="f" font-size="15" font-weight="800" fill="#3fd6a6">ENGINE</text>
<text x="572" y="463.0" class="f" font-size="12.5" fill="#cfd8f3">44 streaming features, additive model from scratch,</text>
<text x="572" y="478.0" class="f" font-size="12.5" fill="#cfd8f3">escalate-only rules, expected-cost policy</text>
<line class="dash" x1="420.6" y1="505.0" x2="560" y2="505.0" stroke="#e0a21a" stroke-opacity=".8"/>
<circle cx="416.6" cy="505.0" r="3.5" fill="#e0a21a"/>
<text x="572" y="503.0" class="f" font-size="15" font-weight="800" fill="#e0a21a">DATA IN</text>
<text x="572" y="519.0" class="f" font-size="12.5" fill="#cfd8f3">Simulated India with 8 fraud types,</text>
<text x="572" y="534.0" class="f" font-size="12.5" fill="#cfd8f3">284,807 real card payments, about 57,000 real texts</text>
<text x="960" y="350" class="f" font-size="13" font-weight="800" fill="#8fa0ba">WHERE IT RUNS</text>
<g class="bob" style="animation-delay:0.3s"><polygon points="958.0,450.0 1010.0,480.0 1010.0,444.0 958.0,414.0" fill="#368bb3"/><polygon points="1010.0,480.0 1062.0,450.0 1062.0,414.0 1010.0,444.0" fill="#26627e"/><polygon points="1010.0,384.0 1062.0,414.0 1010.0,444.0 958.0,414.0" fill="#67c0ea" stroke="#a2d9f2" stroke-opacity=".9"/><line x1="1023.0" y1="391.5" x2="971.0" y2="421.5" stroke="#fff" stroke-opacity=".12"/><line x1="997.0" y1="391.5" x2="1049.0" y2="421.5" stroke="#fff" stroke-opacity=".12"/><line x1="1036.0" y1="399.0" x2="984.0" y2="429.0" stroke="#fff" stroke-opacity=".12"/><line x1="984.0" y1="399.0" x2="1036.0" y2="429.0" stroke="#fff" stroke-opacity=".12"/><line x1="1049.0" y1="406.5" x2="997.0" y2="436.5" stroke="#fff" stroke-opacity=".12"/><line x1="971.0" y1="406.5" x2="1023.0" y2="436.5" stroke="#fff" stroke-opacity=".12"/></g>
<text x="1010" y="520" text-anchor="middle" class="f" font-size="13" font-weight="800" fill="#bfe6fa">Render</text>
<text x="1010" y="538" text-anchor="middle" class="f" font-size="11" fill="#8fa0ba">free plan, sleeps</text>
<g class="bob" style="animation-delay:0.8s"><polygon points="1078.0,450.0 1130.0,480.0 1130.0,444.0 1078.0,414.0" fill="#bb7824"/><polygon points="1130.0,480.0 1182.0,450.0 1182.0,414.0 1130.0,444.0" fill="#845419"/><polygon points="1130.0,384.0 1182.0,414.0 1130.0,444.0 1078.0,414.0" fill="#f2ac54" stroke="#f7cc97" stroke-opacity=".9"/><line x1="1143.0" y1="391.5" x2="1091.0" y2="421.5" stroke="#fff" stroke-opacity=".12"/><line x1="1117.0" y1="391.5" x2="1169.0" y2="421.5" stroke="#fff" stroke-opacity=".12"/><line x1="1156.0" y1="399.0" x2="1104.0" y2="429.0" stroke="#fff" stroke-opacity=".12"/><line x1="1104.0" y1="399.0" x2="1156.0" y2="429.0" stroke="#fff" stroke-opacity=".12"/><line x1="1169.0" y1="406.5" x2="1117.0" y2="436.5" stroke="#fff" stroke-opacity=".12"/><line x1="1091.0" y1="406.5" x2="1143.0" y2="436.5" stroke="#fff" stroke-opacity=".12"/></g>
<text x="1130" y="520" text-anchor="middle" class="f" font-size="13" font-weight="800" fill="#ffe0b0">AWS ECS</text>
<text x="1130" y="538" text-anchor="middle" class="f" font-size="11" fill="#8fa0ba">always on</text>
</svg>