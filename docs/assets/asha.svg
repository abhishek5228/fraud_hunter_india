<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-label="Asha's story twice: without a check she loses 18,500 rupees; with Fraud Hunter the scam text is flagged and the payment is declined">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d172d"/><stop offset="1" stop-color="#14224a"/></linearGradient>
    <marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff6b82"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3fd6a6"/></marker>
    <style>.f{font-family:Inter,'Segoe UI',Arial,sans-serif}@keyframes b{0%,100%{opacity:.6}50%{opacity:1}}.bl{animation:b 2.4s ease-in-out infinite}</style>
  </defs>
  <rect width="1200" height="470" rx="20" fill="url(#bg)"/>
  <text x="40" y="44" class="f" font-size="20" font-weight="800" fill="#fff">Asha's evening, twice</text>

  <text x="40" y="86" class="f" font-size="14" font-weight="800" fill="#ff6b82" letter-spacing="1.5">WITHOUT A CHECK</text>
  <g class="f" font-size="14">
    <g transform="translate(40 100)"><rect width="250" height="112" rx="14" fill="#2a1630" stroke="#ff6b82" stroke-opacity=".5"/><text x="18" y="30" fill="#ff9aab" font-weight="800">1  The SMS</text><text x="18" y="54" fill="#e9d8ee" font-size="13">"Your electricity will be cut</text><text x="18" y="72" fill="#e9d8ee" font-size="13">tonight. Call this number."</text><text x="18" y="96" fill="#b99fc4" font-size="12">9 pm, a number she cannot place</text></g>
    <g transform="translate(330 100)"><rect width="250" height="112" rx="14" fill="#2a1630" stroke="#ff6b82" stroke-opacity=".5"/><text x="18" y="30" fill="#ff9aab" font-weight="800">2  The "officer"</text><text x="18" y="54" fill="#e9d8ee" font-size="13">Polite, calm. Says a Rs 10</text><text x="18" y="72" fill="#e9d8ee" font-size="13">"verification" is needed.</text><text x="18" y="96" fill="#b99fc4" font-size="12">Asks her to install a support app</text></g>
    <g transform="translate(620 100)"><rect width="250" height="112" rx="14" fill="#2a1630" stroke="#ff6b82" stroke-opacity=".5"/><text x="18" y="30" fill="#ff9aab" font-weight="800">3  The screen-share</text><text x="18" y="54" fill="#e9d8ee" font-size="13">The app lets him see and</text><text x="18" y="72" fill="#e9d8ee" font-size="13">use her phone.</text><text x="18" y="96" fill="#b99fc4" font-size="12">He opens her UPI app</text></g>
    <g transform="translate(910 100)"><rect width="250" height="112" rx="14" fill="#4a1623" stroke="#ff6b82"/><text x="18" y="30" fill="#ff6b82" font-weight="800">4  Rs 18,500 is gone</text><text x="18" y="54" fill="#f6d2d9" font-size="13">To a stranger's mule account.</text><text x="18" y="72" fill="#f6d2d9" font-size="13">She "approves" it herself.</text><text x="18" y="96" fill="#d9a3ae" font-size="12">Old system: unusual? no. Approved.</text></g>
  </g>
  <g stroke="#ff6b82" stroke-width="2.4" fill="none" marker-end="url(#r)"><path d="M292 156H326"/><path d="M582 156H616"/><path d="M872 156H906"/></g>

  <text x="40" y="262" class="f" font-size="14" font-weight="800" fill="#3fd6a6" letter-spacing="1.5">WITH FRAUD HUNTER</text>
  <g class="f" font-size="14">
    <g transform="translate(40 276)"><rect width="250" height="150" rx="14" fill="#10302d" stroke="#3fd6a6" stroke-opacity=".6"/><text x="18" y="30" fill="#3fd6a6" font-weight="800">1  She pastes the SMS</text><text x="18" y="52" fill="#d8f3ea" font-size="13">into Scam Shield first.</text><rect x="18" y="68" width="214" height="30" rx="15" fill="#cc2f46"/><text x="125" y="89" text-anchor="middle" fill="#fff" font-weight="800" font-size="14">DANGER  64 / 100</text><text x="18" y="124" fill="#a9d9cb" font-size="12.5">Bill-threat wording, urgency, a</text><text x="18" y="141" fill="#a9d9cb" font-size="12.5">personal number to call. In Hindi too.</text></g>
    <g transform="translate(330 276)"><rect width="250" height="150" rx="14" fill="#10302d" stroke="#3fd6a6" stroke-opacity=".6"/><text x="18" y="30" fill="#3fd6a6" font-weight="800">2  If she pays anyway</text><text x="18" y="54" fill="#d8f3ea" font-size="13">The engine sees what is around</text><text x="18" y="72" fill="#d8f3ea" font-size="13">the payment:</text><text x="18" y="96" fill="#a9d9cb" font-size="12.5">screen-share app running</text><text x="18" y="114" fill="#a9d9cb" font-size="12.5">first-ever payee, a person, 18x</text><text x="18" y="132" fill="#a9d9cb" font-size="12.5">her usual amount</text></g>
    <g transform="translate(620 276)"><rect width="250" height="150" rx="14" fill="#10302d" stroke="#3fd6a6" stroke-opacity=".6"/><text x="18" y="30" fill="#3fd6a6" font-weight="800">3  Decline, with reasons</text><text x="18" y="54" fill="#d8f3ea" font-size="13">Rule SCREEN_SHARE_NEW_PAYEE</text><text x="18" y="72" fill="#d8f3ea" font-size="13">fires. Risk 98%.</text><text x="18" y="96" fill="#a9d9cb" font-size="12.5">Expected cost if approved:</text><text x="18" y="114" fill="#a9d9cb" font-size="12.5">Rs 18,716, against Rs 8 for</text><text x="18" y="132" fill="#a9d9cb" font-size="12.5">declining.</text></g>
    <g transform="translate(910 276)"><rect width="250" height="150" rx="14" fill="#0f4a3b" stroke="#3fd6a6"/><text x="18" y="30" fill="#7ff0c9" font-weight="800">4  Asha keeps her money</text><text x="18" y="54" fill="#d8f3ea" font-size="13">She is told in plain words:</text><text x="18" y="76" fill="#fff" font-size="13" font-weight="700">"Never share your OTP or PIN.</text><text x="18" y="94" fill="#fff" font-size="13" font-weight="700">Call 1930."</text><text x="18" y="122" fill="#a9d9cb" font-size="12.5">The mule payee is remembered, so</text><text x="18" y="139" fill="#a9d9cb" font-size="12.5">the next victim is protected too.</text></g>
  </g>
  <g stroke="#3fd6a6" stroke-width="2.4" fill="none" marker-end="url(#g)" class="bl"><path d="M292 350H326"/><path d="M582 350H616"/><path d="M872 350H906"/></g>
  <text x="600" y="456" text-anchor="middle" class="f" font-size="13" fill="#8fa0ba">The customer is not hacked. The customer is talked into paying. That is the fraud this project is built for.</text>
</svg>
