<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-label="The decision ruler: the risk at which a payment is stepped up or declined falls as the amount rises">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d172d"/><stop offset="1" stop-color="#14224a"/></linearGradient>
    <style>.f{font-family:Inter,'Segoe UI',Arial,sans-serif}</style>
  </defs>
  <rect width="1200" height="380" rx="20" fill="url(#bg)"/>
  <text x="40" y="44" class="f" font-size="20" font-weight="800" fill="#fff">The bar moves with the amount</text>
  <text x="40" y="68" class="f" font-size="14" fill="#9fb0cf">Each ruler is the same fraud risk scale, from very safe on the left to almost certain fraud on the right. Real values from the console.</text>

  <g class="f">
    <text x="40" y="118" font-size="16" font-weight="800" fill="#fff">Rs 24,909 on UPI</text>
    <g transform="translate(40 130)"><rect width="1120" height="34" rx="6" fill="#0f8a66"/><rect x="280" width="609" height="34" fill="#e0a21a"/><rect x="889" width="231" height="34" fill="#cc2f46"/><rect x="1114" width="6" height="34" rx="3" fill="#cc2f46"/>
      <text x="12" y="23" font-size="13" fill="#fff" font-weight="800">APPROVE</text><text x="296" y="23" font-size="13" fill="#2a1d00" font-weight="800">STEP-UP: ask for more proof</text><text x="905" y="23" font-size="13" fill="#fff" font-weight="800">DECLINE</text></g>
    <g font-size="12.5" fill="#cfd8f3"><text x="320" y="184" text-anchor="middle">step-up from 0.1% risk</text><text x="929" y="184" text-anchor="middle">decline from 15% risk</text></g>
    <path d="M320 164V172M929 164V172" stroke="#cfd8f3"/>

    <text x="40" y="236" font-size="16" font-weight="800" fill="#fff">Rs 97,503 on UPI (four times the money)</text>
    <g transform="translate(40 248)"><rect width="1120" height="34" rx="6" fill="#0f8a66"/><rect x="134" width="612" height="34" fill="#e0a21a"/><rect x="746" width="374" height="34" fill="#cc2f46"/>
      <text x="12" y="23" font-size="13" fill="#fff" font-weight="800">APPROVE</text><text x="150" y="23" font-size="13" fill="#2a1d00" font-weight="800">STEP-UP: ask for more proof</text><text x="762" y="23" font-size="13" fill="#fff" font-weight="800">DECLINE</text></g>
    <g font-size="12.5" fill="#cfd8f3"><text x="174" y="302" text-anchor="middle">step-up from 0.03% risk</text><text x="786" y="302" text-anchor="middle">decline from 4.6% risk</text></g>
    <path d="M174 282V290M786 282V290" stroke="#cfd8f3"/>
  </g>
  <g class="f" font-size="14" fill="#b9c6e8"><text x="40" y="346">The bigger the payment, the less risk it takes to stop it. A Rs 150 payment is approved at risks that would stop one of Rs 1 lakh.</text></g>
  <g class="f" font-size="12" fill="#7f93ff"><text x="40" y="365">Scale: risk on a log axis from 0.01% (left) to 100% (right). The colour boundaries sit at the real cut points.</text></g>
</svg>
