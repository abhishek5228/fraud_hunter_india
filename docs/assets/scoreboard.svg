<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="Measured results: real card fraud AUC 0.98, real smishing flagged 63.6 percent, false alarms 0.04 percent, 99 percent of simulated fraud stopped, 0.10 millisecond median decision, 154 tests">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d172d"/><stop offset="1" stop-color="#14224a"/></linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000" flood-opacity=".35"/></filter>
    <style>.f{font-family:Inter,'Segoe UI',Arial,sans-serif}</style>
  </defs>
  <rect width="1200" height="420" rx="20" fill="url(#bg)"/>
  <text x="40" y="44" class="f" font-size="20" font-weight="800" fill="#fff">The scoreboard, with where each number comes from</text>
  <g class="f" filter="url(#sh)">
    <g transform="translate(40 72)"><rect width="352" height="150" rx="16" fill="#f4f7ff"/><rect width="8" height="150" rx="4" fill="#3fd6a6"/><text x="28" y="34" font-size="12.5" font-weight="800" fill="#0f8a66">REAL DATA</text><text x="28" y="82" font-size="46" font-weight="800" fill="#1b2638">AUC 0.98</text><text x="28" y="108" font-size="13" fill="#4a5a76">284,807 real card payments, 492 fraud.</text><text x="28" y="126" font-size="13" fill="#4a5a76">Latest 20% as the test (75 fraud): 86.7%</text><text x="28" y="142" font-size="13" fill="#4a5a76">caught at 1% false alarms, wide intervals.</text></g>
    <g transform="translate(424 72)"><rect width="352" height="150" rx="16" fill="#f4f7ff"/><rect width="8" height="150" rx="4" fill="#3fd6a6"/><text x="28" y="34" font-size="12.5" font-weight="800" fill="#0f8a66">REAL DATA</text><text x="28" y="82" font-size="46" font-weight="800" fill="#1b2638">63.6%</text><text x="28" y="108" font-size="13" fill="#4a5a76">of real smishing flagged by Scam Shield,</text><text x="28" y="126" font-size="13" fill="#4a5a76">held-out half (about 56% on wording it</text><text x="28" y="142" font-size="13" fill="#4a5a76">never saw). Mostly US and English texts.</text></g>
    <g transform="translate(808 72)"><rect width="352" height="150" rx="16" fill="#f4f7ff"/><rect width="8" height="150" rx="4" fill="#3fd6a6"/><text x="28" y="34" font-size="12.5" font-weight="800" fill="#0f8a66">REAL DATA</text><text x="28" y="82" font-size="46" font-weight="800" fill="#1b2638">0.04%</text><text x="28" y="108" font-size="13" fill="#4a5a76">of about 27,000 real ordinary texts falsely</text><text x="28" y="126" font-size="13" fill="#4a5a76">flagged; none of 664 real Indian telecom</text><text x="28" y="142" font-size="13" fill="#4a5a76">messages (that file also tuned the rules).</text></g>
    <g transform="translate(40 248)"><rect width="352" height="150" rx="16" fill="#f4f7ff"/><rect width="8" height="150" rx="4" fill="#e0a21a"/><text x="28" y="34" font-size="12.5" font-weight="800" fill="#b97d00">SIMULATED</text><text x="28" y="82" font-size="46" font-weight="800" fill="#1b2638">99.0%</text><text x="28" y="108" font-size="13" fill="#4a5a76">of fraud stopped on the 45-day sample,</text><text x="28" y="126" font-size="13" fill="#4a5a76">while 3.84% of good customers are touched.</text><text x="28" y="142" font-size="13" fill="#4a5a76">Cost Rs 96,707 vs Rs 1.04 crore if approved.</text></g>
    <g transform="translate(424 248)"><rect width="352" height="150" rx="16" fill="#f4f7ff"/><rect width="8" height="150" rx="4" fill="#7f93ff"/><text x="28" y="34" font-size="12.5" font-weight="800" fill="#3b57e0">MEASURED ON ONE MACHINE</text><text x="28" y="82" font-size="46" font-weight="800" fill="#1b2638">0.10 ms</text><text x="28" y="108" font-size="13" fill="#4a5a76">median decision, 0.24 ms at p99, about</text><text x="28" y="126" font-size="13" fill="#4a5a76">9,300 payments a second. Engine only,</text><text x="28" y="142" font-size="13" fill="#4a5a76">one Python thread; the network adds more.</text></g>
    <g transform="translate(808 248)"><rect width="352" height="150" rx="16" fill="#f4f7ff"/><rect width="8" height="150" rx="4" fill="#7f93ff"/><text x="28" y="34" font-size="12.5" font-weight="800" fill="#3b57e0">CODE</text><text x="28" y="82" font-size="46" font-weight="800" fill="#1b2638">154 tests</text><text x="28" y="108" font-size="13" fill="#4a5a76">passing: engine, rules, API, hardening,</text><text x="28" y="126" font-size="13" fill="#4a5a76">real-data loaders, and a check that the</text><text x="28" y="142" font-size="13" fill="#4a5a76">browser and server agree word for word.</text></g>
  </g>
</svg>
