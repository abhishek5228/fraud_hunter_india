# Lint config only. The default rule set below catches real mistakes (syntax errors, undefined names,
# unused imports) without forcing a style on the codebase.
line-length = 180
target-version = "py312"

[lint]
select = ["E9", "F63", "F7", "F82", "F401"]

[lint.per-file-ignores]
"fh/__init__.py" = ["F401"]
