# Render blueprint: New > Blueprint > pick this repo. Free plan works; the service sleeps when idle.
services:
  - type: web
    name: fraud-hunter-api
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: FH_ORIGINS
        value: "*"
      - key: FH_PREWARM          # fetch the small real collections at boot so the Real data tab is ready after a restart
        value: "1"
