# Keeps the free Render server awake while judges may be looking (it sleeps after about 15 minutes idle).
# On a PUBLIC repository Actions minutes are free. On a private one this uses your monthly minutes, so disable it when the event is over
# (Actions tab > Keep the demo server awake > "..." > Disable workflow).
name: Keep the demo server awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /api/health
        run: curl -fsS --retry 3 --retry-delay 10 --max-time 60 https://fraud-hunter-api.onrender.com/api/health
